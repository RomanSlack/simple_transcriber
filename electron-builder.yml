appId: com.romanslack.simpletranscriber
productName: Simple Transcriber
directories:
  output: release
  buildResources: assets
files:
  - dist/**/*
  - package.json
  - "!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}"
  - "!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples}"
asarUnpack:
  - "**/node_modules/ffmpeg-static/**"
  - "**/node_modules/better-sqlite3/**"
  - "**/node_modules/keytar/**"
publish:
  provider: github
  owner: RomanSlack
  repo: simple_transcriber
linux:
  target:
    - AppImage
    - deb
  category: AudioVideo
  icon: assets/icon.png
win:
  target: nsis
  icon: assets/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Simple Transcriber
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
  installerHeaderIcon: assets/icon.ico
  installerHeader: assets/installerHeader.bmp
  installerSidebar: assets/installerSidebar.bmp
  uninstallerSidebar: assets/uninstallerSidebar.bmp
  artifactName: ${productName}-Setup-${version}.${ext}
mac:
  target: dmg
  category: public.app-category.productivity
  icon: assets/icon.png
